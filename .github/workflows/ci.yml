name: YouTube Analytics CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort flake8 mypy pytest python-dotenv

    - name: Check code formatting with Black
      run: |
        black --check --line-length=120 --diff .

    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black --diff .

    - name: Lint with flake8
      run: |
        flake8 --max-line-length=120 --exclude=.git,__pycache__,notebooks,venv,.venv

    - name: Type checking with mypy
      run: |
        mypy web/ src/ --ignore-missing-imports

    - name: Validate LOC limits
      run: |
        python scripts/validate_loc_limits.py

  database-tests:
    runs-on: ubuntu-latest
    name: Database Connectivity Tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: youtube_analytics_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest python-dotenv

    - name: Set up test environment
      run: |
        cp .env.example .env.test
        echo "DB_HOST=127.0.0.1" >> .env.test
        echo "DB_PORT=3306" >> .env.test
        echo "DB_USER=root" >> .env.test
        echo "DB_PASS=test_password" >> .env.test
        echo "DB_NAME=youtube_analytics_test" >> .env.test

    - name: Create database schema
      run: |
        set -a
        source .env.test
        set +a
        python tools/core/create_tables.py

    - name: Run database tests
      run: |
        set -a
        source .env.test
        set +a
        python -m pytest tests/test_database_schema.py -v

    - name: Test schema validation
      run: |
        set -a
        source .env.test
        set +a
        # Schema alignment test temporarily disabled - script missing
        # python scripts/test_schema_alignment.py
        echo "Schema validation test skipped (script missing)"

  notebook-validation:
    runs-on: ubuntu-latest
    name: Notebook Execution Tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install jupyter nbconvert

    - name: Validate notebook syntax
      run: |
        python scripts/validate_notebooks.py

    - name: Check notebook outputs are stripped
      run: |
        python scripts/check_notebook_outputs.py

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [code-quality, database-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run integration tests
      run: |
        python -m pytest tests/test_integration.py -v

    - name: Generate CI report
      run: |
        python scripts/generate_ci_report.py
