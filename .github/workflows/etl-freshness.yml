name: ETL Data Freshness Monitoring

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  etl-freshness-check:
    runs-on: ubuntu-latest

    env:
      RUN_DB_TESTS: "1"
      ETL_FRESHNESS_MAX_AGE_DAYS: "7"
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[etl]

      - name: Run ETL data freshness test
        # This workflow is dedicated to the MySQL-backed freshness check.
        # It can be triggered manually via `workflow_dispatch` or on the
        # weekly schedule above. Scheduled runs do not support inputs, so
        # configuration is controlled via the env block and repository
        # secrets only.
        run: |
          pytest tests/test_etl_data_freshness.py -v

