[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-analytics-platform"
version = "1.0.0"
description = "Professional YouTube Analytics and Sentiment Analysis Platform"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4-Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "altair>=5.0.0",
    "requests>=2.28.0",
    "pymysql>=1.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "vaderSentiment>=3.3.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "nbformat>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/your-org/youtube-analytics-platform"
"Bug Reports" = "https://github.com/your-org/youtube-analytics-platform/issues"
"Source" = "https://github.com/your-org/youtube-analytics-platform"

# =============================================================================
# BLACK CONFIGURATION
# =============================================================================
[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories to exclude
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | venv
  | \.venv
  | migrations
  | __pycache__
  | archive
  | \.cleanup_backups
)/
'''

# =============================================================================
# ISORT CONFIGURATION
# =============================================================================
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "web", "tools", "scripts", "tests"]
known_first_party = ["youtubeviz", "data_organization", "notebook_guardian"]
known_third_party = [
    "pandas", "numpy", "plotly", "altair", "requests", "pymysql",
    "sqlalchemy", "sklearn", "vaderSentiment", "jupyter", "nbconvert"
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
skip_glob = [
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/archive/*",
    "*/.cleanup_backups/*"
]

# =============================================================================
# FLAKE8 CONFIGURATION
# =============================================================================
[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
    "W504",  # line break after binary operator
    "E402",  # module level import not at top of file (sometimes needed)
    "F401",  # imported but unused (handled by isort and IDE)
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    "migrations",
    "node_modules",
    "archive",
    ".cleanup_backups",
]
per-file-ignores = [
    "__init__.py:F401",  # Allow unused imports in __init__.py
    "tests/*:S101",      # Allow assert statements in tests
]

# =============================================================================
# MYPY CONFIGURATION
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten over time
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Exclude patterns
exclude = [
    "build/",
    "dist/",
    "venv/",
    ".venv/",
    "migrations/",
    "__pycache__/",
    "archive/",
    ".cleanup_backups/",
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "plotly.*",
    "altair.*",
    "pymysql.*",
    "vaderSentiment.*",
    "sklearn.*",
    "nbconvert.*",
    "nbformat.*",
]
ignore_missing_imports = true

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov=web",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "database: marks tests that require database connection",
    "api: marks tests that require API access",
]

# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================
[tool.coverage.run]
source = ["src", "web"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
# Start with basic checks, expand gradually
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]

# Ignore current violations (baseline approach)
ignore = [
    "E501",  # Line too long (handled by black)
]

# Safe automatic fixes only
fixable = ["F401", "I", "W291", "W292", "W293", "E302", "E303", "E305"]
unfixable = ["F841"]  # Don't auto-remove unused variables

line-length = 120
target-version = "py38"

[tool.ruff.per-file-ignores]
# Tests can be more flexible
"tests/**/*.py" = ["F401", "F841"]
# Scripts can use print statements
"scripts/**/*.py" = ["T201"]
