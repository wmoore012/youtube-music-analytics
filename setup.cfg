# Flake8 Configuration
[flake8]
max-line-length = 120
# Relax non-critical rules so CI focuses on correctness; security/undefined/syntax remain strict via --select gates
ignore =
    E121,E126,E128,E203,E225,E226,E302,E303,E305,E402,E741,
    W291,W293,W391,W503,
    C901,
    E501,F401,F541,F841
exclude =
    .git,
    __pycache__,
    .venv,
    .pytest_cache,
    *.egg-info,
    build,
    dist,
    notebooks,
    datasets,
    examples,
    tools,
    web,
    scripts,
    src/public,
    src/data_organization,
    src/notebook_guardian,
    archive,
    .cleanup_backups

# Per-file ignores for specific patterns
per-file-ignores =
    __init__.py:F401
    src/youtubeviz/advanced_charts.py: C901,E501,F401,F841,W503,E402
    src/youtubeviz/charts.py: F841,F401
    src/youtubeviz/viz_theme.py: W293,W391,E501
    src/youtubeviz/model_benchmark_system.py: C901,E501,F401

max-complexity = 15
