<!DOCTYPE html>

  <head>

    <link rel="icon" href="/global/site-icon.png" type="image/png">

  <body>
    <div class="transition">
      <div class="transition-overlay overlay"></div>
      <div class="transition-logo">
        <img src="/global/logo.png" alt="Logo" />
      </div>
    </div>
    <div class="mask-transition"></div>
    <div class="mask-bg-overlay"></div>

    <nav class="menu">
      <div class="menu-header">
        <a href="#" class="menu-logo"><img src="/global/logo.png" alt="" /></a>
        <button class="menu-toggle" aria-label="Toggle menu">
          <div class="menu menu-hamburger-icon">
            <span class="menu-item"></span>
            <span class="menu-item"></span>
          </div>
        </button>
      </div>
      <div class="menu-overlay">
        <nav class="menu-nav">
          <ul>
            <li><a href="/">Overview</a></li>
            <li><a href="/about">About</a></li>

        <div class="menu-footer">
          <div class="menu-social">
            <a href="https://www.linkedin.com/in/wiltonmoore/"><span>&#9654;</span> LinkedIn</a>

          <div class="menu-time">Roster signals</div>
        </div>
      </div>

    <section class="contact">
      <div class="home-spotlight-top-bar">
        <div class="container">
          <div class="symbols-container">
            <div class="symbol">
              <img src="/symbols/s1-light.png" alt="Symbol" />
            </div>
          </div>
          <div class="symbols-container">
            <div class="symbol">
              <img src="/symbols/s1-light.png" alt="Symbol" />
            </div>
          </div>
        </div>
      </div>
      <div class="container">
        <div class="contact-header">
          <div class="contact-callout">
            <p
              class="mono"
              data-animate-type="scramble"
              data-animate-delay="0.25"
            >
              <span>&#9654;</span> Email: wmoore012@gmail.com
            </p>
          </div>
          <div class="contact-header-title">
            <h2 data-animate-type="line-reveal" data-animate-delay="0.25">
              Let’s talk TrackStats YT
            </h2>
          </div>
        </div>
        <div class="contact-gif">
          <img src="/contact/contact.gif" alt="" />
        </div>
      </div>
      <div class="home-spotlight-bottom-bar">
        <div class="container">
          <p
            class="mono"
            data-animate-type="scramble"
            data-animate-delay="0.25"
          >
            <span>&#9654;</span> LinkedIn: linkedin.com/in/wiltonmoore
          </p>
          <p
            class="mono"
            data-animate-type="scramble"
            data-animate-delay="0.25"
          >
            <span>&#9654;</span> GitHub: github.com/wmoore012
          </p>
          <p
            class="mono"
            data-animate-type="scramble"
            data-animate-delay="0.25"
          >
            <span>&#9654;</span> Charlotte, NC
          </p>
          <p
            class="mono"
            data-animate-type="scramble"
            data-animate-delay="0.25"
          >
            <span>&#9654;</span> Open to remote U.S. roles
          </p>
        </div>
      </div>
    </section>

    <script type="module" src="/script/lenis-scroll.js"></script>
    <script type="module" src="/script/transition.js"></script>
